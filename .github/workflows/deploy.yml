name: Build and deploy

on:
  push:
    branches: [ "main" ]
    paths:
      - "api/**"
      - "docker/api/**"
      - ".github/workflows/deploy.yml"
  pull_request:
    branches: [ "main" ]
    paths:
      - "api/**"
      - "docker/api/**"
      - ".github/workflows/deploy.yml"

permissions:
  contents: write
  id-token: write

env:
  AWS_REGION: eu-west-1
  ECR_REPOSITORY: incident-api

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Build image (no push)
        if: github.event_name == 'pull_request'
        run: |
          docker build -f docker/api/Dockerfile -t incident-api:pr-${{ github.event.pull_request.number }} .

      - name: Configure AWS credentials via OIDC
        if: github.event_name == 'push'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_GITHUB_ACTIONS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        if: github.event_name == 'push'
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push image
        if: github.event_name == 'push'
        env:
          REGISTRY: ${{ steps.ecr-login.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -f docker/api/Dockerfile \
            -t "$REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" .
          docker push "$REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"

      - name: Bump image tag in Helm values
        if: github.event_name == 'push'
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          yq -i ".image.tag = \"$IMAGE_TAG\"" incident-api/values.yaml
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add incident-api/values.yaml
          git commit -m "chore: deploy image $IMAGE_TAG [skip ci]" || echo "nothing to commit"
          git push