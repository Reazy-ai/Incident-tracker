replicaCount: 3
autoscaling:
  enabled: false
  minReplicas: 2
  maxReplicas: 5
image:
  repository: 762233745764.dkr.ecr.eu-west-1.amazonaws.com/incident-api
  tag: "c1cf148ccaaed980870f93a9f9564895f76c3c3e"
  pullPolicy: IfNotPresent
service:
  type: ClusterIP
  port: 80
  targetPort: 8080
container:
  port: 8080
resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi
httpRoute:
  enabled: false
ingress:
  enabled: true
serviceAccount:
  create: false
  annotations: {}
  name: default
readinessProbe:
  httpGet:
    path: /ready
    port: 8080
  initialDelaySeconds: 5
  periodSeconds: 5
livenessProbe:
  httpGet:
    path: /health
    port: 8080
  initialDelaySeconds: 10
  periodSeconds: 10
secrets:
  dbPasswordSecretName: db-credentials
  dbPasswordSecretKey: password
