apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: app-db-password
  namespace: default
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore
  target:
    name: db-credentials
  data:
    - secretKey: password
      remoteRef:
        key: incident-db-credentials-2
        property: password